<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  /* Mirrors site/dist CSS: white ground, Arial, weight 400, tight tracking,
     muted grey secondary text, hairline rules. No bold, no gradients. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #fff;
    color: #262626;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 78px 92px 66px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    font-size: 19px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #8a8a8a;
  }
  h1 {
    font-size: 84px;
    font-weight: 400;
    letter-spacing: -3.2px;
    line-height: 1.02;
    margin: 26px 0 0;
  }
  .tagline {
    font-size: 29px;
    color: #6f6f6f;
    line-height: 1.45;
    margin-top: 22px;
    max-width: 820px;
  }
  .rule { height: 1px; background: #ececec; }
  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 40px;
    padding-top: 26px;
  }
  .poem { font-size: 22px; color: #8a8a8a; letter-spacing: -.2px; }
  .domain { font-size: 22px; color: #333; letter-spacing: .01em; }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">AI &amp; Bitcoin</div>
    <h1>Unspent Thoughts</h1>
    <div class="tagline">News that earned its place — selected, written<br>and fact-checked by software, every decision logged.</div>
  </div>
  <div>
    <div class="rule"></div>
    <div class="foot">
      <div class="poem">Bitcoin is scarce. Intelligence is becoming abundant. Time remains finite.</div>
      <div class="domain">unspentthoughts.com</div>
    </div>
  </div>
</body>
</html>
