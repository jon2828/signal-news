name: pipeline

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: unspentthoughts-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install article extractor
        run: pip install trafilatura

      - name: Run pipeline (kill switch checked inside every script)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Kill switch: set this repo VARIABLE to "false" in
          # Settings > Secrets and variables > Actions > Variables
          PIPELINE_ENABLED: ${{ vars.PIPELINE_ENABLED || 'true' }}
          # Optional X announcing: add these four secrets to enable auto-posting.
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          set -e
          python3 scripts/gather.py
          python3 scripts/dedupe.py
          python3 scripts/triage.py
          python3 scripts/write.py
          python3 scripts/edit.py
          python3 scripts/build.py
          # Fail the run loudly if any page ships raw markdown (literal '#'
          # headings, '*Date*' lines, unconverted links) instead of publishing it.
          python3 tests/test_render.py
          python3 scripts/announce.py

      - name: Commit and push (the public audit trail)
        run: |
          git config user.name "unspentthoughts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes this run"
          else
            git commit -m "pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # A merge can land on main while this run works; rebase and retry.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "push attempt $i failed (race with another push); retrying in 15s"
              sleep 15
            done
            echo "push failed after 3 attempts"
            exit 1
          fi
